name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    branches: [main, dev]
    types: [opened]

permissions: {}

# Serialize reruns for the same issue/PR to prevent duplicate comments.
concurrency:
  group: tsdb-greeting-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      # Metadata and comments only. Never check out or run PR-controlled code in this workflow.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_MESSAGE: |
            Hi there 👋,

            Thank you so much for your attention to TSDB and PyPOTS! You can follow me on GitHub to receive the latest news of TSDB and PyPOTS. If you find TSDB helpful to your work, please star⭐️ this repository. Your star is your recognition, which can help more people notice PyPOTS and grow PyPOTS community. It matters and is definitely a kind of contribution to the community.

            I have received your message and will respond ASAP. Thank you for your patience! 😃

            Best,
            Wenjie
          PR_MESSAGE: |
            Hi there 👋,

            We really really appreciate that you have taken the time to make this PR on TSDB!

            If you are trying to fix a bug, please reference the issue number in the description or give your details about the bug.
            If you are implementing a feature request, please check with the maintainers that the feature will be accepted first.

            Best,
            Wenjie
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            const author = item?.user;
            if (author?.type !== "User" || !author.login || !author.id ||
                /\[bot\]$/i.test(author.login)) {
              core.info("Skipping non-human or missing author");
              return;
            }
            // The issues API includes pull requests. Count earlier contributions of
            // either type, regardless of their state, using the event author's ID.
            const history = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, creator: author.login, state: "all", per_page: 100,
            });
            if (history.some(entry => entry.number < item.number && entry.user?.id === author.id)) {
              core.info(`Skipping returning contributor ${author.login}`);
              return;
            }
            const params = { ...context.repo, issue_number: item.number };
            const message = (context.payload.issue ? process.env.ISSUE_MESSAGE : process.env.PR_MESSAGE).trimEnd();
            const marker = "<!-- tsdb-first-contribution-greeting -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...params, per_page: 100,
            });
            // Recognize both the new marker and the previous workflow's exact message.
            if (comments.some(comment => comment.user?.login === "github-actions[bot]" &&
                (comment.body?.includes(marker) || comment.body?.trim() === message.trim()))) {
              core.info(`Already greeted #${item.number}`);
              return;
            }
            await github.rest.issues.createComment({ ...params, body: `${message}\n\n${marker}` });
