name: "Issue Manager"

on:
  push:
    branches:
      - temp_test_manager
  schedule:
    - cron: "0 8 * * *"
  issues:
    types:
      - labeled

permissions:
  issues: write

jobs:
  issue-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: tiangolo/issue-manager@dc846170c36eb62fb434b3d943b36399fe240fb5 # 0.8.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: >
            {
                "completed": {
                    "delay": "30 days",
                    "message": "It seems the issue was completed. Closing it now.",
                    "remove_label_on_comment": false,
                    "remove_label_on_close": false
                }
            }
