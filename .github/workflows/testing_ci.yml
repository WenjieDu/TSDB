name: CI

on:
    push:
        branches: [main, dev, temp_test_branch]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    compatibility:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Test the minimum and current supported Python across all platforms.
                    - os: ubuntu-latest
                      python: '3.10'
                    - os: windows-latest
                      python: '3.10'
                    - os: macOS-latest
                      python: '3.10'
                    - os: ubuntu-latest
                      python: '3.14'
                    - os: windows-latest
                      python: '3.14'
                    - os: macOS-latest
                      python: '3.14'
        uses: ./.github/workflows/ci_job.yml
        with:
            os: ${{ matrix.os }}
            python: ${{ matrix.python }}
            suite: offline
            coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' }}

    package-validation:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: '3.10'

            - name: Install hash-verified package validation dependencies
              run: |
                  python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements/requirements_release.txt

            - name: Build, install and validate exact distributions
              run: |
                  python scripts/release_pipeline.py install --output "$RUNNER_TEMP/tsdb-package"
                  python scripts/release_pipeline.py package --output "$RUNNER_TEMP/tsdb-package"
                  python scripts/check_release.py --dist "$RUNNER_TEMP/tsdb-package/dist"

            - name: Upload validated distributions
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: validated-distributions
                  path: ${{ runner.temp }}/tsdb-package/dist/*
                  if-no-files-found: error
