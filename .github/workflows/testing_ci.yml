name: CI

on:
    push:
        branches: [main, dev, temp_test_branch]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    compatibility:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Python 3.8 is still the declared minimum; pin a compatible Ubuntu image.
                    - os: ubuntu-22.04
                      python: '3.8'
                    - os: windows-latest
                      python: '3.8'
                    - os: macOS-latest
                      python: '3.8'
                    - os: ubuntu-latest
                      python: '3.14'
                    - os: windows-latest
                      python: '3.14'
                    - os: macOS-latest
                      python: '3.14'
        uses: ./.github/workflows/ci_job.yml
        with:
            os: ${{ matrix.os }}
            python: ${{ matrix.python }}
            suite: offline
            coverage: ${{ matrix.os == 'ubuntu-latest' }}
            locked: ${{ matrix.os == 'ubuntu-latest' }}
