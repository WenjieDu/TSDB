name: Daily Testing

on:
    schedule:
        - cron: '0 0 * * *'
    push:
        branches: [run_daily_testing]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    compatibility:
        strategy:
            fail-fast: false
            matrix:
                python: ['3.11', '3.12', '3.13']
        uses: ./.github/workflows/ci_job.yml
        with:
            os: ubuntu-latest
            python: ${{ matrix.python }}
            suite: offline
            checkout-ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

    live-datasets:
        # Only one full live download suite per run; failures are not suppressed.
        uses: ./.github/workflows/ci_job.yml
        with:
            os: ubuntu-latest
            python: '3.13'
            suite: combined
            checkout-ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
